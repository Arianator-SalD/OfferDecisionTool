    function getAiSummaryEndpoint() {
      return AI_SUMMARY_ENDPOINT.trim().replace(/\/+$/, "");
    }

    function updateSummaryAvailability(
      comparisonStatus = getComparisonStatus(dimensions, getActiveArchive()),
      hasEligibleOffer = getRanking().length > 0
    ) {
      const ready = canGenerateDecisionSummary(comparisonStatus, hasEligibleOffer);
      generateSummaryButton.disabled = !ready;
      generateSummaryButton.textContent = hasGeneratedDecisionSummary && !hasMarkedDecisionSummaryStale
        ? "重新生成 AI 分析"
        : "生成 AI 分析";
      if (!comparisonStatus.isComplete) {
        summaryHint.textContent = `完成评分后可生成分析（${comparisonStatus.completedScoreCount}/${comparisonStatus.totalRequiredScoreCount}）`;
      } else if (!hasEligibleOffer) {
        summaryHint.textContent = "暂无满足底线的 Offer";
      } else {
        summaryHint.textContent = "基于当前评分生成可复盘的决策说明";
      }
    }

    async function generateDecisionSummary() {
      const endpoint = getAiSummaryEndpoint();
      const activeArchive = getActiveArchive();
      const comparisonStatus = getComparisonStatus(dimensions, activeArchive);
      const rankedOffers = getRanking();
      if (!canGenerateDecisionSummary(comparisonStatus, rankedOffers.length > 0)) {
        return;
      }

      const recommendation = buildSummaryPayload({
        dimensions,
        activeArchive,
        rankedOffers,
        comparisonStatus
      });
      generateSummaryButton.disabled = true;
      generateSummaryButton.textContent = "生成中...";
      let summary = buildLocalDecisionSummary({
        dimensions,
        activeArchive,
        rankedOffers,
        comparisonStatus
      });

      if (endpoint) {
        try {
          const response = await fetch(`${endpoint}/summary`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(recommendation),
            signal: AbortSignal.timeout(8000)
          });
          const data = await response.json();
          if (!response.ok || !data?.summary) {
            throw new Error(data?.error || "empty summary");
          }
          summary = data.summary;
        } catch (error) {
          console.warn("AI summary unavailable", error);
        }
      }

      hasGeneratedDecisionSummary = true;
      hasMarkedDecisionSummaryStale = false;
      decisionSummaryText.textContent = summary;
      updateSummaryAvailability();
    }

    function getThemeColor(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function colorWithAlpha(color, alpha) {
      const hex = color.trim();
      const shortHexMatch = hex.match(/^#([0-9a-f]{3})$/i);
      const longHexMatch = hex.match(/^#([0-9a-f]{6})$/i);
      const normalizedHex = shortHexMatch
        ? shortHexMatch[1].split("").map((char) => char + char).join("")
        : longHexMatch?.[1];

      if (!normalizedHex) {
        return color;
      }

      const r = parseInt(normalizedHex.slice(0, 2), 16);
      const g = parseInt(normalizedHex.slice(2, 4), 16);
      const b = parseInt(normalizedHex.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function drawRadar() {
      const box = canvas.parentElement.getBoundingClientRect();
      const size = Math.max(220, Math.floor(Math.min(box.width, box.height || box.width)));
      const dpr = window.devicePixelRatio || 1;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      context.clearRect(0, 0, size, size);

      const centerX = size / 2;
      const centerY = size / 2 - size * 0.035;
      const radius = size * 0.34;
      const labelRadius = size * 0.41;
      const stepCount = 5;
      const count = dimensions.length;
      const colors = {
        primary: getThemeColor("--primary"),
        border: getThemeColor("--border"),
        borderStrong: getThemeColor("--border-strong"),
        textMuted: getThemeColor("--text-muted")
      };

      context.lineWidth = 1;
      context.strokeStyle = colors.border;
      context.fillStyle = colors.textMuted;
      context.font = "700 10px -apple-system, BlinkMacSystemFont, PingFang SC, sans-serif";
      context.textAlign = "center";
      context.textBaseline = "middle";

      for (let step = 1; step <= stepCount; step += 1) {
        const points = dimensions.map((_, index) => {
          const angle = getAngle(index, count);
          const pointRadius = (radius * step) / stepCount;
          return getPoint(centerX, centerY, pointRadius, angle);
        });
        drawPolygon(points, false, step === stepCount ? colors.borderStrong : colors.border);
      }

      dimensions.forEach((dimension, index) => {
        const angle = getAngle(index, count);
        const end = getPoint(centerX, centerY, radius, angle);
        context.beginPath();
        context.moveTo(centerX, centerY);
        context.lineTo(end.x, end.y);
        context.strokeStyle = colors.border;
        context.stroke();

        const label = getPoint(centerX, centerY, labelRadius, angle);
        context.fillStyle = colors.textMuted;
        context.fillText(shortLabel(dimension.label), label.x, label.y);
      });

      const weightPoints = dimensions.map((dimension, index) => {
        const activeArchive = getActiveArchive();
        const angle = getAngle(index, count);
        return getPoint(centerX, centerY, radius * (activeArchive.weights[dimension.id] / 10), angle);
      });
      drawPolygon(weightPoints, true, colors.borderStrong, colorWithAlpha(colors.borderStrong, 0.18));

      const topOffer = getRanking()[0] || null;
      if (topOffer) {
        const offerPoints = dimensions.map((dimension, index) => {
          const angle = getAngle(index, count);
          return getPoint(centerX, centerY, radius * (getScoreNumber(topOffer.scores[dimension.id]) / 10), angle);
        });
        drawPolygon(offerPoints, true, colors.primary, colorWithAlpha(colors.primary, 0.16));
      }

      drawLegend(size, colors, Boolean(topOffer));
    }

    function getAngle(index, count) {
      return -Math.PI / 2 + (index * Math.PI * 2) / count;
    }

    function getPoint(cx, cy, radius, angle) {
      return {
        x: cx + Math.cos(angle) * radius,
        y: cy + Math.sin(angle) * radius
      };
    }

    function drawPolygon(points, filled, strokeStyle, fillStyle = "transparent") {
      context.beginPath();
      points.forEach((point, index) => {
        if (index === 0) {
          context.moveTo(point.x, point.y);
        } else {
          context.lineTo(point.x, point.y);
        }
      });
      context.closePath();
      if (filled) {
        context.fillStyle = fillStyle;
        context.fill();
      }
      context.strokeStyle = strokeStyle;
      context.lineWidth = filled ? 2.8 : 1;
      context.stroke();

      if (filled) {
        points.forEach((point) => {
          context.beginPath();
          context.arc(point.x, point.y, 4, 0, Math.PI * 2);
          context.fillStyle = strokeStyle;
          context.fill();
        });
      }
    }

    function drawLegend(size, colors, hasTopOffer) {
      const items = [{ label: "权重", color: colors.borderStrong }];
      if (hasTopOffer) {
        items.push({ label: "第一名", color: colors.primary });
      }
      const y = size - 10;
      let x = size / 2 - 58;

      context.font = "800 11px -apple-system, BlinkMacSystemFont, PingFang SC, sans-serif";
      context.textAlign = "left";
      context.textBaseline = "middle";
      items.forEach((item) => {
        context.fillStyle = item.color;
        context.fillRect(x, y - 4, 16, 8);
        context.fillStyle = colors.textMuted;
        context.fillText(item.label, x + 22, y);
        x += 72;
      });
    }

    function shortLabel(label) {
      return label.replace("程度", "").replace("概率", "").replace("帮助", "");
    }

    function addOffer() {
      const activeArchive = getActiveArchive();
      const nextNumber = activeArchive.offers.length + 1;
      const scores = Object.fromEntries(dimensions.map((dimension) => [dimension.id, ""]));
      const notes = Object.fromEntries(dimensions.map((dimension) => [dimension.id, ""]));
      activeArchive.offers.push({
        id: crypto.randomUUID(),
        name: `Offer ${nextNumber}`,
        scores,
        note: "",
        notes
      });
      render();
      requestAnimationFrame(scrollToLatestOffer);
    }

    function scrollToLatestOffer() {
      scoreTableWrap.scrollTo({
        left: scoreTableWrap.scrollWidth,
        behavior: "smooth"
      });
    }

    render();
  </script>
</body>
</html>
