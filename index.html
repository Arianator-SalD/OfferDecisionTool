<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer 选择打分表</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;

      --primary: #0066cc;
      --primary-hover: #0055b3;
      --primary-soft: #e8f3ff;
      --mist: #86868b;
      --mist-soft: #f5f5f7;

      --text: #1d1d1f;
      --text-muted: #6e6e73;
      --text-light: #86868b;
      --text-inverse: #ffffff;

      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-subtle: #f5f5f7;
      --surface-hover: #f0f6ff;
      --surface-raised: #ffffff;

      --border: #d2d2d7;
      --border-strong: #aeaeb2;
      --focus-border: #0066cc;

      --success: #248a3d;
      --success-soft: #eaf7ed;
      --warning: #b76e00;
      --warning-soft: #fff4df;
      --danger: #a85a63;
      --danger-soft: #fcf2f3;
      --danger-border: #edd9dc;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.16);

      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 2px;
      border-color: var(--focus-border);
      box-shadow: none;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--focus-border);
      box-shadow: none;
    }

    .page {
      width: min(1360px, calc(100% - 64px));
      margin: 0 auto;
      padding: 20px 0 64px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(240px, 340px);
      align-items: center;
      gap: 32px;
      min-height: 44px;
      margin-bottom: 32px;
    }

    .titleGroup {
      min-width: 0;
    }

    .archiveArea {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .archiveSelector {
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr);
      gap: 8px;
      align-items: center;
    }

    .archiveLabel {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .archiveSelect {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .archiveDropdown {
      position: relative;
      min-width: 0;
    }

    .archiveDropdownButton {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 18px;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 10px 0 12px;
      color: var(--text);
      background: var(--surface-raised);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      box-shadow: none;
    }

    .archiveDropdownButton:hover {
      border-color: var(--primary);
      background: var(--surface-hover);
    }

    .archiveDropdownButton:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 2px;
      border-color: var(--focus-border);
    }

    .archiveDropdownValue {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .archiveDropdownIcon {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      transition: transform 0.16s ease;
    }

    .archiveDropdown.isOpen .archiveDropdownIcon {
      transform: rotate(180deg);
    }

    .archiveMenu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 7px);
      z-index: 12;
      display: grid;
      gap: 4px;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      background: var(--surface-raised);
      box-shadow: var(--shadow-lg);
    }

    .archiveOption {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-height: 40px;
      border-radius: 8px;
      padding: 0 9px;
      color: var(--text);
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
    }

    .archiveOption:hover,
    .archiveOption:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 0;
      background: var(--surface-hover);
    }

    .archiveOption.isActive {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .archiveOptionCheck {
      display: grid;
      place-items: center;
      width: 18px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }

    .archiveOptionName {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .archiveInlineName {
      width: 100%;
      min-width: 0;
      border: 0;
      border-radius: 4px;
      padding: 2px 0;
      color: inherit;
      background: transparent;
      font: inherit;
      font-weight: inherit;
    }

    .archiveInlineName:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 2px;
    }

    .archiveRenameField {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .archiveRenameButton {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }

    .archiveRenameButton svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .archiveRenameButton:hover {
      color: var(--primary);
    }

    .archiveRenameButton:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 2px;
    }

    .archiveDeleteButton {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      color: var(--text-light);
      background: transparent;
      font-size: 18px;
      line-height: 1;
    }

    .archiveDeleteButton:hover {
      color: var(--danger);
      background: transparent;
    }
    .archiveMenuDivider {
      height: 1px;
      margin: 4px 2px;
      background: var(--border);
    }

    .archiveMenuAction {
      grid-template-columns: minmax(0, 1fr);
      color: var(--text);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 520px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .accountArea {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: nowrap;
      justify-content: flex-end;
    }

    .authSummary {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      text-align: right;
    }

    .authBadge {
      justify-self: end;
      width: fit-content;
      border: 0;
      border-radius: 999px;
      padding: 0;
      color: var(--primary);
      background: transparent;
      font-size: 12px;
      font-weight: 600;
    }

    .syncStatus {
      margin: 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: right;
    }

    .authModalBackdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.36);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .authModal {
      width: min(380px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.2), 0 4px 12px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      animation: modalIn 180ms ease-out;
    }

    .authModalHeader {
      display: block;
      padding: 28px 28px 0;
      text-align: center;
    }

    .authModalHeader h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .authModalHeader p {
      margin: 8px 0 0;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .authModalHeader p:empty,
    .summaryText:empty {
      display: none;
    }

    .iconButton {
      display: none;
    }

    .authForm {
      display: grid;
      gap: 24px;
      padding: 20px 28px 0;
      text-align: center;
    }

    .oauthButton {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 10px;
      min-height: 42px;
      color: var(--text);
      border-color: var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .oauthIcon {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      color: var(--text-inverse);
      background: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .authDivider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .authDivider::before,
    .authDivider::after {
      content: "";
      height: 1px;
      background: var(--border);
    }

    .authModalActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin: 0 -28px;
      border-top: 1px solid var(--border);
      gap: 0;
    }

    .authModalStatus {
      display: none;
      margin: 0;
      padding: 0;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.55;
    }

    .authModalStatus.isVisible {
      display: block;
    }

    .authModalStatus.isError {
      color: var(--danger);
    }

    .authModalActions .button {
      min-height: 52px;
      border: 0;
      border-radius: 0;
      padding: 0 18px;
      background: transparent;
      box-shadow: none;
      font-size: 15px;
      font-weight: 600;
    }

    .authModalActions .button + .button {
      border-left: 1px solid var(--border);
    }

    .authModalActions .button.secondary {
      color: var(--primary);
      background: transparent;
    }

    .authModalActions .button.secondary:hover {
      background: var(--primary-soft);
    }

    .authModalActions .button.danger {
      color: var(--danger);
      background: transparent;
    }

    .authModalActions .button.danger:hover {
      color: #9a3e49;
      background: var(--danger-soft);
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(4px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .toastRegion {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 30;
      display: grid;
      gap: 10px;
      width: min(360px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
      pointer-events: auto;
      animation: toastIn 0.18s ease-out;
    }

    .toast.isInfo {
      border-color: var(--mist);
      color: var(--text);
      background: var(--mist-soft);
    }

    .toast.isSuccess {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-soft);
    }

    .toast.isError {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-soft);
    }

    .toast.isLeaving {
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .isHidden {
      display: none !important;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 600;
      color: var(--text-inverse);
      border: 1px solid var(--primary);
      background: var(--primary);
      box-shadow: none;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
      white-space: nowrap;
    }

    .button:not(:disabled):active {
      transform: translateY(1px);
    }

    .button:hover {
      background: var(--primary-hover);
      box-shadow: none;
    }

    .button:disabled,
    .iconButton:disabled,
    .deleteButton:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .button.secondary {
      color: var(--text);
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: none;
    }

    .button.secondary:hover {
      background: var(--mist-soft);
    }

    #generateSummaryButton {
      color: var(--text);
      border-color: var(--border);
      background: var(--surface-subtle);
    }

    #generateSummaryButton:hover {
      background: var(--mist-soft);
    }

    .button.danger {
      color: var(--danger);
      border-color: var(--danger);
      background: var(--danger-soft);
      box-shadow: none;
    }

    .button.danger:hover {
      background: var(--danger);
      color: var(--text-inverse);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr);
      gap: 40px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      background: transparent;
    }

    .mainColumn {
      min-width: 0;
    }

    .panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 0 16px;
    }

    .panelHeader h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .panelHeaderActions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .smallNote {
      margin: 0;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: right;
    }

    .textButton {
      padding: 8px 0;
      color: var(--primary);
      background: transparent;
      font-size: 13px;
      font-weight: 600;
    }

    .textButton:hover,
    .textButton:focus-visible {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .fieldGroup {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .fieldLabel {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .tableWrap {
      overflow-x: auto;
      overflow-y: visible;
      max-height: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-raised);
      box-shadow: var(--shadow-sm);
      scrollbar-color: var(--border-strong) transparent;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 560px;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 10px;
      vertical-align: middle;
      background: var(--surface-raised);
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: var(--text);
      background: var(--surface-subtle);
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 3;
      min-width: 138px;
      box-shadow: 1px 0 0 var(--border);
    }

    th:first-child {
      z-index: 4;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td,
    tbody tr:hover td:first-child {
      background: var(--surface-hover);
    }

    .offerName {
      width: 100%;
      min-width: 100px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text);
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
    }

    .offerHeader {
      display: grid;
      gap: 8px;
      min-width: 176px;
    }

    .offerMetaRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .offerNoteButton {
      display: block;
      min-width: 0;
      min-height: 32px;
      padding: 0;
      overflow: hidden;
      color: var(--text-muted);
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      text-align: left;
    }

    .offerNoteButton:hover,
    .offerNoteButton:focus-visible,
    .offerNoteButton[aria-expanded="true"] {
      color: var(--primary);
    }

    .offerNotePreview {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .offerNoteButton.hasNote .offerNotePreview {
      color: var(--text-muted);
    }

    .noteEditorStatus {
      flex: none;
      color: var(--text-light);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .noteEditorStatus.isSaved {
      color: var(--success);
    }

    .dimensionName {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .anchorToggle {
      min-height: 30px;
      margin-top: 4px;
      padding: 0;
      color: var(--text-muted);
      background: transparent;
      font-size: 11px;
      font-weight: 600;
    }

    .anchorToggle:hover,
    .anchorToggle:focus-visible {
      color: var(--primary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    tbody tr td:first-child {
      border-left: 0;
      background: var(--surface);
    }

    .scoreCell {
      position: relative;
      min-width: 176px;
      cursor: text;
    }

    .scoreInput {
      display: block;
      width: 48px;
      min-height: 38px;
      margin: 0 auto;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 6px;
      color: var(--text);
      background: transparent;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .scoreInput:hover {
      background: var(--surface-hover);
    }

    .scoreInput:focus,
    .scoreCell.isActive .scoreInput {
      border-color: var(--focus-border);
      background: var(--surface-raised);
    }

    .scoreCell.hasError .scoreInput {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .scoreWarning {
      display: none;
      margin-top: 4px;
      color: var(--danger);
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }

    .scoreCell.hasError .scoreWarning {
      display: block;
    }

    .noteButton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      min-height: 30px;
      margin-top: 2px;
      padding: 0;
      overflow: hidden;
      color: var(--text-muted);
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .noteButton.hasNote {
      justify-content: flex-start;
    }

    .noteButtonPreview {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .noteButton:hover,
    .noteButton:focus-visible {
      color: var(--primary);
    }

    .anchorGuideRow td,
    .anchorGuideRow td:first-child {
      position: static;
      padding: 0;
      background: var(--surface-subtle);
      box-shadow: none;
    }

    .anchorGuide {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      min-width: 520px;
      padding: 12px 16px;
    }

    .anchorItem {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: baseline;
      min-width: 0;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .anchorScore {
      color: var(--text);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .noteEditorRow td:first-child,
    .offerNoteEditorRow td:first-child {
      position: static;
      min-width: 0;
      box-shadow: none;
    }

    .noteEditorRow td,
    .offerNoteEditorRow td {
      padding: 0;
      background: var(--surface-subtle);
    }

    .noteEditor {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .noteEditorHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .noteEditorTitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .noteEditorStatus {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      margin-left: auto;
      font-size: 11px;
    }

    .noteEditorComplete {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 8px;
      color: var(--primary);
      background: transparent;
      font-size: 12px;
      font-weight: 600;
    }

    .noteEditorComplete:hover,
    .noteEditorComplete:focus-visible {
      color: var(--primary-hover);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .noteEditorInput {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--text);
      background: var(--surface-raised);
      font-size: 13px;
      line-height: 1.5;
    }

    .noteEditorClose {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 4px;
      padding: 0 0 2px;
      color: var(--text-muted);
      background: transparent;
      font-size: 18px;
      line-height: 1;
    }

    .noteEditorClose:hover,
    .noteEditorClose:focus-visible {
      color: var(--text);
      background: var(--surface-hover);
    }

    .deleteButton {
      min-width: 60px;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-light);
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .deleteButton svg {
      width: 14px;
      height: 14px;
      flex: none;
    }

    .deleteButton:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .deleteButton:not(:disabled):hover {
      border-color: transparent;
      color: var(--danger);
      background: transparent;
    }

    .deleteButton:not(:disabled):focus-visible {
      border-color: var(--focus-border);
      color: var(--text-muted);
      background: var(--surface-subtle);
    }

    .sideStack {
      display: block;
      position: sticky;
      top: 24px;
      align-self: start;
    }

    .preferencePanel {
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      padding-bottom: 28px;
    }

    .preferencePanel .weights {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px 24px;
    }

    .chartPanel {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      margin-top: 24px;
    }

    .chartArea {
      display: grid;
      gap: 24px;
      padding: 0;
      align-items: center;
    }

    .chartPanel > summary {
      list-style: none;
      cursor: pointer;
    }

    .chartPanel > summary::-webkit-details-marker {
      display: none;
    }

    .chartPanel > summary::after {
      content: "+";
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 400;
    }

    .chartPanel[open] > summary::after {
      content: "-";
    }

    .radarBox {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1;
      min-height: 246px;
      margin: 0 auto;
      background: transparent;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .weights {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .weightControl {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 8px 10px;
      align-items: center;
      min-width: 0;
    }

    .weightControl label {
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .weightRange {
      grid-column: 1 / -1;
    }

    input[type="range"] {
      width: 100%;
      min-width: 0;
      accent-color: var(--primary);
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--focus-border);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .weightValue {
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      text-align: right;
    }

    .minimumControl {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .minimumLabel {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .minimumSelect {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 30px 0 10px;
      color: var(--text);
      background: var(--surface-raised);
      font-size: 12px;
      font-weight: 600;
    }

    .minimumSettingsButton,
    .minimumSummary {
      min-height: 32px;
      padding: 0;
      color: var(--text-muted);
      background: transparent;
      font-size: 11px;
      font-weight: 600;
    }

    .minimumSettingsButton:hover,
    .minimumSummary:hover {
      color: var(--primary);
    }

    .minimumSummary {
      grid-column: 1 / -1;
      justify-self: start;
    }

    .winnerPanel {
      padding: 0;
    }

    .winnerTitle {
      margin: 0 0 16px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
    }

    .winner {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      align-items: baseline;
      padding: 0 0 20px;
      border: 0;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }

    .winnerName {
      margin: 0;
      min-width: 0;
      font-size: 28px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .winnerScore {
      color: var(--text);
      font-size: 28px;
      font-weight: 700;
      white-space: nowrap;
    }

    .ranking {
      display: grid;
      gap: 0;
      margin-top: 0;
    }

    .recommendationDetails {
      display: grid;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }

    .recommendationDetailsTitle {
      margin: 0 0 4px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .recommendationDetail {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 10px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .recommendationDetailLabel {
      color: var(--text);
      font-weight: 700;
    }

    .constraintFailures {
      display: grid;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }

    .constraintFailuresTitle {
      margin: 0 0 4px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .constraintFailure {
      display: grid;
      gap: 2px;
      padding: 7px 0;
    }

    .constraintFailureName {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .constraintFailureReason {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .summaryBox {
      margin-top: 24px;
      border: 0;
      border-top: 1px solid var(--border);
      padding: 22px 0 0;
      background: transparent;
    }

    .summaryHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .summaryBox > summary {
      list-style: none;
      cursor: pointer;
    }

    .summaryBox > summary::-webkit-details-marker {
      display: none;
    }

    .summaryBox > summary::after {
      content: "+";
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 400;
    }

    .summaryBox[open] > summary::after {
      content: "-";
    }

    .summaryContent {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .summaryBox:not([open]) > .summaryContent {
      display: none;
    }

    .summaryHeading {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .summaryTitle {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .summaryHint {
      margin: 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .summaryText {
      margin: 0;
      min-height: 44px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .rankRow {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 44px;
      padding: 14px 0;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
    }

    .rankRow:first-child {
      border-color: var(--border);
      background: transparent;
    }

    .rankNo {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 0;
      color: var(--text-muted);
      background: transparent;
      font-weight: 600;
      font-size: 11px;
    }

    .rankRow:first-child .rankNo {
      color: var(--primary);
      background: transparent;
    }

    .rankName {
      min-width: 0;
      font-weight: 600;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .rankScore {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
    }

    .rankRow:first-child .rankScore {
      color: var(--primary);
    }

    .bar {
      grid-column: 2 / 4;
      height: 2px;
      border-radius: 999px;
      background: var(--surface-subtle);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--border-strong);
    }

    .rankRow:first-child .bar span {
      background: var(--primary);
    }

    @media (prefers-reduced-motion: reduce) {
      .button,
      .iconButton,
      .archiveDropdownIcon,
      .deleteButton,
      .toast.isLeaving {
        transition: none;
      }

      .toast,
      .authModal {
        animation: none;
      }
    }

    @media (max-width: 1080px) {
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .tableWrap {
        max-height: none;
      }

      .sideStack {
        position: static;
        max-height: none;
        overflow: visible;
      }
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .accountArea {
        justify-content: space-between;
      }

      .authSummary {
        text-align: left;
      }

      .authBadge {
        justify-self: start;
      }
    }

    @media (max-width: 720px) {
      .page {
        width: min(100% - 20px, 1280px);
        padding: 12px 0 40px;
      }

      .topbar,
      .panelHeader {
        align-items: stretch;
        flex-direction: column;
      }

      .topbar {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 28px;
      }

      .titleGroup,
      .archiveArea,
      .accountArea {
        flex: none;
      }

      .archiveArea {
        min-width: 0;
        width: 100%;
      }

      .archiveSelector {
        grid-template-columns: 1fr;
      }

      .panelHeaderActions {
        align-items: center;
        flex-direction: row;
        justify-content: space-between;
        width: 100%;
      }

      .accountArea {
        align-items: stretch;
        flex-direction: column;
      }

      .authSummary {
        text-align: left;
      }

      .authBadge {
        justify-self: start;
      }

      .toastRegion {
        top: 12px;
        right: 10px;
        left: 10px;
        width: auto;
      }

      .button {
        width: 100%;
        flex: none;
      }

      .subtitle,
      .smallNote {
        text-align: left;
      }

      .weightControl {
        grid-template-columns: minmax(0, 1fr) 30px;
      }

      .minimumSelect {
        min-height: 44px;
      }

      .offerNoteButton,
      .noteButton,
      .anchorToggle,
      .deleteButton,
      .scoreInput {
        min-height: 44px;
      }

      .preferencePanel .weights {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .winner {
        grid-template-columns: 1fr;
      }

      .winnerScore {
        grid-row: auto;
        grid-column: auto;
      }
    }

    @media (max-width: 520px) {
      .preferencePanel .weights {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="titleGroup">
        <h1>Offer 比较</h1>
      </div>
      <div class="archiveArea" aria-label="档案管理">
        <div class="archiveSelector">
          <label class="archiveLabel" for="archiveSelect">当前档案</label>
          <select class="archiveSelect" id="archiveSelect"></select>
          <div class="archiveDropdown" id="archiveDropdown">
            <button class="archiveDropdownButton" id="archiveDropdownButton" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="archiveDropdownValue" id="archiveDropdownValue">暑期实习 offer</span>
              <span class="archiveDropdownIcon" aria-hidden="true">⌄</span>
            </button>
            <div class="archiveMenu isHidden" id="archiveMenu" role="menu" aria-label="档案菜单"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="authModalBackdrop isHidden" id="archiveModalBackdrop">
      <section class="authModal" role="dialog" aria-modal="true" aria-labelledby="archiveModalTitle">
        <div class="authModalHeader">
          <div>
            <h2 id="archiveModalTitle">新建档案</h2>
            <p id="archiveModalDescription">创建一组完整 offer 数据。</p>
          </div>
          <button class="iconButton" id="closeArchiveModalButton" type="button" aria-label="关闭档案窗口">&times;</button>
        </div>
        <form class="authForm" id="archiveForm">
          <p class="authModalStatus isVisible" id="archiveModalMessage"></p>
          <div class="authModalActions">
            <button class="button secondary" id="archiveCancelButton" type="button">取消</button>
            <button class="button" id="archiveConfirmButton" type="submit">确认</button>
          </div>
        </form>
      </section>
    </div>

    <div class="grid">
      <section class="mainColumn" aria-labelledby="scoreTitle">
        <section class="panel preferencePanel" aria-labelledby="preferenceTitle">
          <div class="panelHeader">
            <div>
              <h2 id="preferenceTitle">你更在意什么</h2>
              <p class="smallNote">数值越高，越重要；0 不参与比较</p>
            </div>
            <div class="panelHeaderActions">
              <button class="minimumSettingsButton" id="minimumSettingsButton" type="button" aria-controls="weightControls" aria-expanded="false">设置底线</button>
            </div>
          </div>
          <div class="weights" id="weightControls"></div>
        </section>

        <section class="panel" aria-labelledby="scoreTitle">
          <div class="panelHeader">
            <h2 id="scoreTitle">评分矩阵</h2>
            <div class="panelHeaderActions">
              <p class="smallNote" id="scoreProgress"></p>
              <button class="textButton" id="addOfferButton" type="button">新增 offer</button>
            </div>
          </div>
          <div class="tableWrap" id="scoreTableWrap">
            <table>
              <thead>
                <tr id="scoreHead"></tr>
              </thead>
              <tbody id="scoreBody"></tbody>
            </table>
          </div>
        </section>

      </section>

      <aside class="sideStack">
        <section class="panel winnerPanel" aria-labelledby="winnerTitle">
          <h2 class="winnerTitle" id="winnerTitle">暂时排名</h2>
          <div class="winner">
            <p class="winnerName" id="winnerName">-</p>
            <div class="winnerScore" id="winnerScore">0.00</div>
          </div>
          <div class="ranking" id="rankingList"></div>
          <div class="recommendationDetails" id="recommendationDetails"></div>
          <div class="constraintFailures isHidden" id="constraintFailures"></div>
          <details class="summaryBox" id="summaryBox" open>
            <summary class="summaryHeader">
              <div class="summaryHeading">
                <h3 class="summaryTitle">AI 分析</h3>
                <p class="summaryHint" id="summaryHint"></p>
              </div>
            </summary>
            <div class="summaryContent">
              <p class="summaryText" id="decisionSummaryText"></p>
              <button class="button" id="generateSummaryButton" type="button">生成 AI 分析</button>
            </div>
          </details>
        </section>

        <details class="panel chartPanel" id="radarDetails" open>
          <summary class="panelHeader" aria-labelledby="radarTitle">
            <h2 id="radarTitle">评分画像</h2>
            <p class="smallNote" id="radarNote">权重与推荐差异</p>
          </summary>
          <div class="chartArea">
            <div class="radarBox">
              <canvas id="radarCanvas" aria-label="Offer 维度权重雷达图"></canvas>
            </div>
          </div>
        </details>
      </aside>

    </div>
  </main>

  <div class="toastRegion" id="toastRegion" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module">
    import {
      getComparisonStatus,
      getHardConstraintStatus,
      getRecommendationExplanation
    } from "./decision-logic.mjs";
    import {
      buildLocalDecisionSummary,
      buildSummaryPayload,
      canGenerateDecisionSummary
    } from "./summary-payload.mjs";

    const STORAGE_KEY = "offerDecisionBoard.v1";
    const AI_SUMMARY_ENDPOINT = "";
    const DEFAULT_ARCHIVE_NAME = "暑期实习 offer";

    const dimensions = [
      { id: "business", label: "业务前景", weight: 5, anchors: ["明显衰退", "稳定", "高增长且有壁垒"] },
      { id: "interest", label: "兴趣程度", weight: 5, anchors: ["抗拒", "可以接受", "强烈期待"] },
      { id: "salary", label: "待遇", weight: 5, anchors: ["低于底线", "达到目标", "明显超预期"] },
      { id: "location", label: "工作地", weight: 5, anchors: ["不可接受", "可以接受", "理想"] },
      { id: "workload", label: "工作生活平衡", weight: 5, anchors: ["不可持续", "可管理", "符合期望"] },
      { id: "conversion", label: "转正概率", weight: 5, anchors: ["几乎没有", "不确定，约五成", "高度确定"] }
    ];

    const defaultOffers = [
      {
        id: crypto.randomUUID(),
        name: "Offer A",
        scores: {
          business: 7,
          interest: 8,
          salary: 6,
          location: 7,
          workload: 6,
          conversion: 7
        },
        note: "",
        notes: {}
      },
      {
        id: crypto.randomUUID(),
        name: "Offer B",
        scores: {
          business: 8,
          interest: 9,
          salary: 8,
          location: 5,
          workload: 7,
          conversion: 5
        },
        note: "",
        notes: {}
      },
      {
        id: crypto.randomUUID(),
        name: "Offer C",
        scores: {
          business: 6,
          interest: 6,
          salary: 9,
          location: 8,
          workload: 5,
          conversion: 8
        },
        note: "",
        notes: {}
      }
    ];

    let state = loadState();
    let archiveModalMode = null;
    let hasGeneratedDecisionSummary = false;
    let hasMarkedDecisionSummaryStale = false;
    let activeNoteSelection = null;
    let activeOfferNoteId = null;
    let minimumSettingsExpanded = false;
    const expandedAnchorDimensions = new Set();

    const scoreHead = document.getElementById("scoreHead");
    const scoreBody = document.getElementById("scoreBody");
    const scoreProgress = document.getElementById("scoreProgress");
    const scoreTableWrap = document.getElementById("scoreTableWrap");
    const weightControls = document.getElementById("weightControls");
    const minimumSettingsButton = document.getElementById("minimumSettingsButton");
    const winnerTitle = document.getElementById("winnerTitle");
    const winnerName = document.getElementById("winnerName");
    const winnerScore = document.getElementById("winnerScore");
    const rankingList = document.getElementById("rankingList");
    const recommendationDetails = document.getElementById("recommendationDetails");
    const constraintFailures = document.getElementById("constraintFailures");
    const summaryBox = document.getElementById("summaryBox");
    const summaryHint = document.getElementById("summaryHint");
    const generateSummaryButton = document.getElementById("generateSummaryButton");
    const decisionSummaryText = document.getElementById("decisionSummaryText");
    const toastRegion = document.getElementById("toastRegion");
    const radarDetails = document.getElementById("radarDetails");
    const radarNote = document.getElementById("radarNote");
    const canvas = document.getElementById("radarCanvas");
    const context = canvas.getContext("2d");
    const archiveSelect = document.getElementById("archiveSelect");
    const archiveDropdown = document.getElementById("archiveDropdown");
    const archiveDropdownButton = document.getElementById("archiveDropdownButton");
    const archiveDropdownValue = document.getElementById("archiveDropdownValue");
    const archiveMenu = document.getElementById("archiveMenu");
    const archiveModalBackdrop = document.getElementById("archiveModalBackdrop");
    const archiveForm = document.getElementById("archiveForm");
    const archiveModalTitle = document.getElementById("archiveModalTitle");
    const archiveModalDescription = document.getElementById("archiveModalDescription");
    const archiveModalMessage = document.getElementById("archiveModalMessage");
    const archiveConfirmButton = document.getElementById("archiveConfirmButton");
    const archiveCancelButton = document.getElementById("archiveCancelButton");
    const closeArchiveModalButton = document.getElementById("closeArchiveModalButton");
    document.getElementById("addOfferButton").addEventListener("click", addOffer);
    minimumSettingsButton.addEventListener("click", () => {
      minimumSettingsExpanded = !minimumSettingsExpanded;
      renderWeights();
    });
    scoreTableWrap.addEventListener("scroll", syncNoteEditorOffset);
    archiveSelect.addEventListener("change", switchArchive);
    archiveDropdownButton.addEventListener("click", toggleArchiveMenu);
    archiveDropdownButton.addEventListener("keydown", handleArchiveDropdownKeydown);
    archiveMenu.addEventListener("keydown", handleArchiveMenuKeydown);
    document.addEventListener("click", closeArchiveMenuOnOutsideClick);
    archiveForm.addEventListener("submit", handleArchiveModalSubmit);
    archiveCancelButton.addEventListener("click", closeArchiveModal);
    closeArchiveModalButton.addEventListener("click", closeArchiveModal);
    archiveModalBackdrop.addEventListener("click", (event) => {
      if (event.target === archiveModalBackdrop) {
        closeArchiveModal();
      }
    });
    generateSummaryButton.addEventListener("click", generateDecisionSummary);
    radarDetails.addEventListener("toggle", () => {
      if (radarDetails.open) {
        drawRadar();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeArchiveMenu();
        closeArchiveModal();
      }
    });
    window.addEventListener("resize", () => {
      drawRadar();
    });

    function cloneDefaultOffers() {
      return defaultOffers.map((offer, index) => ({
        id: crypto.randomUUID(),
        name: offer.name || `Offer ${index + 1}`,
        scores: { ...offer.scores },
        note: offer.note || "",
        notes: Object.fromEntries(dimensions.map((dimension) => [dimension.id, offer.notes?.[dimension.id] || ""]))
      }));
    }

    function getDefaultWeights() {
      return Object.fromEntries(dimensions.map((dimension) => [dimension.id, dimension.weight]));
    }

    function getDefaultMinimumScores() {
      return Object.fromEntries(dimensions.map((dimension) => [dimension.id, ""]));
    }

    function createArchive(name = DEFAULT_ARCHIVE_NAME, payload = {}) {
      return {
        id: payload.id || crypto.randomUUID(),
        name: String(name || DEFAULT_ARCHIVE_NAME).trim() || DEFAULT_ARCHIVE_NAME,
        weights: payload.weights || getDefaultWeights(),
        minimumScores: payload.minimumScores || getDefaultMinimumScores(),
        offers: payload.offers || cloneDefaultOffers()
      };
    }

    function getDefaultState() {
      const archive = createArchive(DEFAULT_ARCHIVE_NAME);
      return {
        activeArchiveId: archive.id,
        archives: [archive]
      };
    }

    function normalizeState(value) {
      const fallback = getDefaultState();
      if (!value || typeof value !== "object") {
        return fallback;
      }

      if (Array.isArray(value.archives) && value.archives.length) {
        const archives = value.archives.map(normalizeArchive).filter(Boolean);
        if (!archives.length) {
          return fallback;
        }

        const activeArchiveId = archives.some((archive) => archive.id === value.activeArchiveId)
          ? value.activeArchiveId
          : archives[0].id;
        return { activeArchiveId, archives };
      }

      const legacyArchive = normalizeArchive({
        id: value.archiveId,
        name: value.archiveName || DEFAULT_ARCHIVE_NAME,
        weights: value.weights,
        minimumScores: value.minimumScores,
        offers: value.offers
      }, 0);

      return {
        activeArchiveId: legacyArchive.id,
        archives: [legacyArchive]
      };
    }

    function normalizeArchive(archive, index) {
      const fallbackWeights = getDefaultWeights();
      const weights = Object.fromEntries(dimensions.map((dimension) => {
        const storedWeight = Number(archive.weights?.[dimension.id]);
        return [dimension.id, Number.isFinite(storedWeight) ? storedWeight : fallbackWeights[dimension.id]];
      }));
      const minimumScores = Object.fromEntries(dimensions.map((dimension) => {
        const storedMinimum = Number(archive.minimumScores?.[dimension.id]);
        return [
          dimension.id,
          Number.isInteger(storedMinimum) && storedMinimum >= 1 && storedMinimum <= 10
            ? storedMinimum
            : ""
        ];
      }));
      const offers = Array.isArray(archive.offers) && archive.offers.length
        ? archive.offers.map(normalizeOffer)
        : cloneDefaultOffers();

      return {
        id: archive.id || crypto.randomUUID(),
        name: String(archive.name || `档案 ${index + 1}`).trim() || `档案 ${index + 1}`,
        weights,
        minimumScores,
        offers
      };
    }

    function loadState() {
      const fallback = getDefaultState();
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) {
        return fallback;
      }

      try {
        return normalizeState(JSON.parse(stored));
      } catch (error) {
        return fallback;
      }
    }

    function normalizeOffer(offer, index) {
      const scores = {};
      const notes = {};
      dimensions.forEach((dimension) => {
        scores[dimension.id] = normalizeScoreValue(offer.scores?.[dimension.id]);
        notes[dimension.id] = String(offer.notes?.[dimension.id] || "");
      });

      return {
        id: offer.id || crypto.randomUUID(),
        name: String(offer.name || `Offer ${index + 1}`),
        scores,
        note: String(offer.note || ""),
        notes
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getStatePayload()));
      markDecisionSummaryStale();
    }

    function getStatePayload() {
      return {
        activeArchiveId: state.activeArchiveId,
        archives: state.archives.map((archive) => ({
          id: archive.id,
          name: archive.name,
          weights: { ...archive.weights },
          minimumScores: { ...archive.minimumScores },
          offers: archive.offers.map((offer) => ({
            id: offer.id,
            name: offer.name,
            scores: { ...offer.scores },
            note: offer.note,
            notes: { ...offer.notes }
          }))
        }))
      };
    }

    function getActiveArchive() {
      if (!Array.isArray(state.archives) || !state.archives.length) {
        const fallback = getDefaultState();
        state.activeArchiveId = fallback.activeArchiveId;
        state.archives = fallback.archives;
      }

      const active = state.archives.find((archive) => archive.id === state.activeArchiveId);
      if (active) {
        return active;
      }

      state.activeArchiveId = state.archives[0].id;
      return state.archives[0];
    }

    function showToast(message, tone = "info", options = {}) {
      const existingToast = options.toast?.isConnected ? options.toast : null;
      const toast = existingToast || document.createElement("div");
      const toneClass = {
        info: "isInfo",
        success: "isSuccess",
        error: "isError"
      }[tone] || "isInfo";

      if (toast._hideTimer) {
        clearTimeout(toast._hideTimer);
      }

      if (toast._removeTimer) {
        clearTimeout(toast._removeTimer);
      }

      toast.className = `toast ${toneClass}`;
      toast.textContent = message;
      toast.setAttribute("role", tone === "error" ? "alert" : "status");
      toastRegion.setAttribute("aria-live", tone === "error" ? "assertive" : "polite");

      if (!existingToast) {
        toastRegion.appendChild(toast);
      }

      if (!options.persist) {
        const duration = options.duration ?? (tone === "error" ? 5600 : 3200);
        toast._hideTimer = window.setTimeout(() => dismissToast(toast), duration);
      }

      return toast;
    }

    function dismissToast(toast) {
      if (!toast?.isConnected) {
        return;
      }

      if (toast._hideTimer) {
        clearTimeout(toast._hideTimer);
      }

      toast.classList.add("isLeaving");
      toast._removeTimer = window.setTimeout(() => {
        toast.remove();
      }, 180);
    }

    function markDecisionSummaryStale() {
      if (!hasGeneratedDecisionSummary || hasMarkedDecisionSummaryStale) {
        return;
      }

      hasMarkedDecisionSummaryStale = true;
      decisionSummaryText.textContent = "";
      updateSummaryAvailability();
    }

    function clampScore(value) {
      if (!Number.isFinite(value)) {
        return 0;
      }
      return Math.max(0, Math.min(10, value));
    }

    function normalizeScoreValue(value) {
      if (value === "" || value === null) {
        return "";
      }
      if (value === undefined) {
        return 5;
      }

      const score = Number(value);
      if (!Number.isFinite(score)) {
        return 5;
      }
      return clampScore(score);
    }

    function getScoreNumber(value) {
      if (value === "" || value === null || value === undefined) {
        return 0;
      }

      const score = Number(value);
      return Number.isFinite(score) ? clampScore(score) : 0;
    }

    function getScoreValidationMessage(value) {
      const trimmed = String(value).trim();
      if (trimmed === "") {
        return "";
      }

      if (!/^\d+$/.test(trimmed)) {
        return "请输入 0-10 的整数";
      }
      const score = Number(trimmed);
      if (!Number.isInteger(score) || score < 0 || score > 10) {
        return "请输入 0-10 的整数";
      }
      return "";
    }

    function sanitizeScoreInput(value) {
      return String(value).match(/^\d{0,2}/)?.[0] || "";
    }

    function getUniqueArchiveName(baseName) {
      const existingNames = new Set(state.archives.map((archive) => archive.name));
      if (!existingNames.has(baseName)) {
        return baseName;
      }

      let index = 2;
      while (existingNames.has(`${baseName} ${index}`)) {
        index += 1;
      }
      return `${baseName} ${index}`;
    }

    function renderArchives() {
      const activeArchive = getActiveArchive();
      archiveSelect.innerHTML = "";
      archiveMenu.innerHTML = "";
      state.archives.forEach((archive) => {
        const option = document.createElement("option");
        option.value = archive.id;
        option.textContent = archive.name;
        archiveSelect.appendChild(option);

        const isActive = archive.id === activeArchive.id;
        const check = document.createElement("span");
        check.className = "archiveOptionCheck";
        check.textContent = isActive ? "✓" : "";

        if (isActive) {
          const currentItem = document.createElement("div");
          currentItem.className = "archiveOption isActive";
          currentItem.setAttribute("role", "group");

          const renameInput = document.createElement("input");
          renameInput.className = "archiveInlineName";
          renameInput.type = "text";
          renameInput.value = archive.name;
          renameInput.maxLength = 40;
          renameInput.autocomplete = "off";
          renameInput.setAttribute("aria-label", "重命名当前档案");
          renameInput.title = "点击修改名称";
          renameInput.addEventListener("keydown", (event) => {
            event.stopPropagation();
            if (event.key === "Enter") {
              event.preventDefault();
              renameInput.value = renameActiveArchive(renameInput.value);
              renameInput.blur();
            } else if (event.key === "Escape") {
              event.preventDefault();
              renameInput.value = archive.name;
              renameInput.blur();
            }
          });
          renameInput.addEventListener("change", () => {
            renameInput.value = renameActiveArchive(renameInput.value);
          });

          const renameField = document.createElement("div");
          renameField.className = "archiveRenameField";
          const renameButton = document.createElement("button");
          renameButton.className = "archiveRenameButton";
          renameButton.type = "button";
          renameButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
          renameButton.title = "重命名当前档案";
          renameButton.setAttribute("aria-label", "重命名当前档案");
          renameButton.addEventListener("click", (event) => {
            event.stopPropagation();
            renameInput.focus();
            renameInput.select();
          });
          renameField.append(renameInput, renameButton);
          if (state.archives.length > 1) {
            const deleteButton = document.createElement("button");
            deleteButton.className = "archiveDeleteButton";
            deleteButton.type = "button";
            deleteButton.textContent = "×";
            deleteButton.title = "删除当前档案";
            deleteButton.setAttribute("aria-label", "删除当前档案");
            deleteButton.addEventListener("click", (event) => {
              event.stopPropagation();
              openDeleteArchiveModal();
            });
            renameField.appendChild(deleteButton);
          }
          currentItem.append(check, renameField);
          archiveMenu.appendChild(currentItem);
          return;
        }

        const menuItem = document.createElement("button");
        menuItem.className = "archiveMenuItem archiveOption";
        menuItem.type = "button";
        menuItem.role = "menuitemradio";
        menuItem.dataset.archiveId = archive.id;
        menuItem.setAttribute("aria-checked", "false");
        const name = document.createElement("span");
        name.className = "archiveOptionName";
        name.textContent = archive.name;

        menuItem.append(check, name);
        menuItem.addEventListener("click", () => selectArchive(archive.id));
        archiveMenu.appendChild(menuItem);
      });

      const divider = document.createElement("div");
      divider.className = "archiveMenuDivider";
      divider.role = "separator";
      archiveMenu.appendChild(divider);

      archiveMenu.appendChild(createArchiveMenuAction("新建档案", createNewArchive));

      archiveSelect.value = activeArchive.id;
      archiveDropdownValue.textContent = activeArchive.name;
      archiveDropdownButton.setAttribute("aria-expanded", String(!archiveMenu.classList.contains("isHidden")));
    }

    function createArchiveMenuAction(label, handler) {
      const action = document.createElement("button");
      action.className = "archiveMenuItem archiveOption archiveMenuAction";
      action.type = "button";
      action.role = "menuitem";
      action.textContent = label;
      action.addEventListener("click", () => {
        closeArchiveMenu();
        handler();
      });
      return action;
    }

    function switchArchive(event) {
      selectArchive(event.target.value);
    }

    function selectArchive(nextArchiveId) {
      if (!nextArchiveId || nextArchiveId === state.activeArchiveId) {
        closeArchiveMenu();
        return;
      }
      state.activeArchiveId = nextArchiveId;
      closeArchiveMenu();
      render();
    }

    function toggleArchiveMenu(event) {
      event.stopPropagation();
      if (archiveMenu.classList.contains("isHidden")) {
        openArchiveMenu();
      } else {
        closeArchiveMenu();
      }
    }

    function openArchiveMenu() {
      archiveDropdown.classList.add("isOpen");
      archiveMenu.classList.remove("isHidden");
      archiveDropdownButton.setAttribute("aria-expanded", "true");
    }

    function closeArchiveMenu() {
      archiveDropdown.classList.remove("isOpen");
      archiveMenu.classList.add("isHidden");
      archiveDropdownButton.setAttribute("aria-expanded", "false");
    }

    function closeArchiveMenuOnOutsideClick(event) {
      if (!archiveDropdown.contains(event.target)) {
        closeArchiveMenu();
      }
    }

    function handleArchiveDropdownKeydown(event) {
      if (event.key === "ArrowDown" || event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openArchiveMenu();
        focusArchiveOption(0);
      }
    }

    function handleArchiveMenuKeydown(event) {
      const options = getArchiveOptionElements();
      const currentIndex = options.indexOf(document.activeElement);
      if (event.key === "ArrowDown") {
        event.preventDefault();
        focusArchiveOption(currentIndex + 1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        focusArchiveOption(currentIndex - 1);
      } else if (event.key === "Home") {
        event.preventDefault();
        focusArchiveOption(0);
      } else if (event.key === "End") {
        event.preventDefault();
        focusArchiveOption(options.length - 1);
      } else if (event.key === "Escape") {
        event.preventDefault();
        closeArchiveMenu();
        archiveDropdownButton.focus();
      }
    }

    function focusArchiveOption(index) {
      const options = getArchiveOptionElements();
      if (!options.length) {
        return;
      }
      const nextIndex = (index + options.length) % options.length;
      options[nextIndex].focus();
    }

    function getArchiveOptionElements() {
      return Array.from(archiveMenu.querySelectorAll("button.archiveMenuItem:not(:disabled)"));
    }

    function createNewArchive() {
      const name = getUniqueArchiveName(`档案 ${state.archives.length + 1}`);
      const archive = createArchive(name);
      state.archives.push(archive);
      state.activeArchiveId = archive.id;
      render();
      showToast(`已新建「${archive.name}」。`, "success");
    }

    function openDeleteArchiveModal() {
      if (state.archives.length <= 1) {
        return;
      }

      const activeArchive = getActiveArchive();
      archiveModalMode = "delete";
      archiveModalTitle.textContent = `删除「${activeArchive.name}」？`;
      archiveModalDescription.textContent = "";
      archiveModalMessage.textContent = "将删除其中所有 offer、权重和备注，且无法撤销。";
      archiveModalMessage.classList.add("isVisible");
      archiveConfirmButton.textContent = "确认删除";
      archiveConfirmButton.classList.add("danger");
      openArchiveModal();
    }

    function openArchiveModal() {
      archiveModalBackdrop.classList.remove("isHidden");
    }

    function closeArchiveModal() {
      archiveModalBackdrop.classList.add("isHidden");
      archiveModalMode = null;
      archiveConfirmButton.classList.remove("danger");
    }

    function handleArchiveModalSubmit(event) {
      event.preventDefault();
      if (archiveModalMode === "delete") {
        deleteArchiveFromModal();
        return;
      }
      if (archiveModalMode === "deleteOffer") {
        deleteOfferFromModal();
      }
    }

    function renameActiveArchive(value) {
      const activeArchive = getActiveArchive();
      const trimmedName = value.trim();
      if (!trimmedName || trimmedName === activeArchive.name) {
        return activeArchive.name;
      }

      activeArchive.name = getUniqueArchiveName(trimmedName);
      const selectedOption = Array.from(archiveSelect.options)
        .find((option) => option.value === activeArchive.id);
      if (selectedOption) {
        selectedOption.textContent = activeArchive.name;
      }
      archiveDropdownValue.textContent = activeArchive.name;
      saveState();
      return activeArchive.name;
    }

    function deleteArchiveFromModal() {
      if (state.archives.length <= 1) {
        closeArchiveModal();
        return;
      }

      const activeArchive = getActiveArchive();
      const activeIndex = state.archives.findIndex((archive) => archive.id === activeArchive.id);
      state.archives = state.archives.filter((archive) => archive.id !== activeArchive.id);
      const nextArchive = state.archives[Math.max(0, activeIndex - 1)] || state.archives[0];
      state.activeArchiveId = nextArchive.id;
      closeArchiveModal();
      render();
    }

    function openDeleteOfferModal(offerId) {
      const activeArchive = getActiveArchive();
      if (activeArchive.offers.length <= 1) {
        return;
      }

      const offer = activeArchive.offers.find((item) => item.id === offerId);
      if (!offer) {
        return;
      }

      archiveModalMode = "deleteOffer";
      archiveModalBackdrop.dataset.offerId = offerId;
      archiveModalTitle.textContent = `删除「${offer.name}」？`;
      archiveModalDescription.textContent = "";
      archiveModalMessage.textContent = "将删除分数和备注，且无法撤销。";
      archiveModalMessage.classList.add("isVisible");
      archiveConfirmButton.textContent = "确认删除";
      archiveConfirmButton.classList.add("danger");
      openArchiveModal();
    }

    function deleteOfferFromModal() {
      const offerId = archiveModalBackdrop.dataset.offerId;
      const activeArchive = getActiveArchive();
      if (activeArchive.offers.length <= 1 || !offerId) {
        closeArchiveModal();
        return;
      }

      activeArchive.offers = activeArchive.offers.filter((offer) => offer.id !== offerId);
      delete archiveModalBackdrop.dataset.offerId;
      closeArchiveModal();
      render();
    }

    function render() {
      renderArchives();
      closeOfferNoteEditor();
      closeNoteEditor();
      renderScoreTable();
      renderWeights();
      renderRanking();
      drawRadar();
      saveState();
    }

    function renderScoreTable() {
      const activeArchive = getActiveArchive();
      updateScoreProgress(activeArchive);
      scoreHead.innerHTML = "";
      const titleCell = document.createElement("th");
      titleCell.textContent = "维度";
      scoreHead.appendChild(titleCell);

      activeArchive.offers.forEach((offer) => {
        const cell = document.createElement("th");
        const header = document.createElement("div");
        header.className = "offerHeader";

        const nameInput = document.createElement("input");
        nameInput.className = "offerName";
        nameInput.value = offer.name;
        nameInput.setAttribute("aria-label", `${offer.name} 名称`);

        const metaRow = document.createElement("div");
        metaRow.className = "offerMetaRow";
        const noteButton = document.createElement("button");
        noteButton.className = "offerNoteButton";
        noteButton.type = "button";
        noteButton.dataset.offerId = offer.id;
        noteButton.setAttribute("aria-expanded", "false");
        noteButton.setAttribute("aria-controls", `offer-note-editor-${offer.id}`);
        updateOfferNoteButtonState(noteButton, offer);
        noteButton.addEventListener("click", () => openOfferNoteEditor(offer.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "deleteButton";
        deleteButton.type = "button";
        deleteButton.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="m19 6-1 14H6L5 6"></path>
            <path d="M10 11v5"></path>
            <path d="M14 11v5"></path>
          </svg>
          <span>删除</span>
        `;
        deleteButton.disabled = activeArchive.offers.length <= 1;
        deleteButton.setAttribute("aria-label", `删除 ${offer.name}`);
        deleteButton.title = deleteButton.disabled ? "至少保留一份 Offer" : `删除 ${offer.name}`;
        deleteButton.addEventListener("click", () => openDeleteOfferModal(offer.id));

        nameInput.addEventListener("input", (event) => {
          offer.name = event.target.value.trim() || "未命名 offer";
          nameInput.setAttribute("aria-label", `${offer.name} 名称`);
          deleteButton.setAttribute("aria-label", `删除 ${offer.name}`);
          if (!deleteButton.disabled) deleteButton.title = `删除 ${offer.name}`;
          renderRanking();
          drawRadar();
          saveState();
        });

        metaRow.append(noteButton, deleteButton);
        header.append(nameInput, metaRow);
        cell.appendChild(header);
        scoreHead.appendChild(cell);
      });

      scoreBody.innerHTML = "";
      dimensions.forEach((dimension) => {
        const row = document.createElement("tr");
        row.dataset.dimensionId = dimension.id;

        const dimensionCell = document.createElement("td");
        const dimensionName = document.createElement("div");
        dimensionName.className = "dimensionName";
        dimensionName.textContent = dimension.label;
        const anchorToggle = document.createElement("button");
        anchorToggle.className = "anchorToggle";
        anchorToggle.type = "button";
        const isAnchorExpanded = expandedAnchorDimensions.has(dimension.id);
        anchorToggle.textContent = isAnchorExpanded ? "收起参考" : "评分参考";
        anchorToggle.setAttribute("aria-expanded", String(isAnchorExpanded));
        anchorToggle.setAttribute("aria-controls", `anchor-guide-${dimension.id}`);
        anchorToggle.addEventListener("click", () => {
          if (isAnchorExpanded) {
            expandedAnchorDimensions.delete(dimension.id);
          } else {
            expandedAnchorDimensions.add(dimension.id);
          }
          closeOfferNoteEditor();
          closeNoteEditor();
          renderScoreTable();
          requestAnimationFrame(() => {
            scoreBody.querySelector(`tr[data-dimension-id="${dimension.id}"] .anchorToggle`)?.focus();
          });
        });
        dimensionCell.append(dimensionName, anchorToggle);
        row.appendChild(dimensionCell);

        activeArchive.offers.forEach((offer) => {
          const cell = document.createElement("td");
          cell.className = "scoreCell";
          cell.dataset.offerId = offer.id;
          cell.dataset.dimensionId = dimension.id;
          const input = document.createElement("input");
          input.className = "scoreInput";
          input.type = "text";
          input.inputMode = "numeric";
          input.autocomplete = "off";
          input.spellcheck = false;
          input.value = offer.scores[dimension.id] ?? "";
          input.setAttribute("aria-label", `${offer.name} ${dimension.label} 分数`);
          const noteButton = document.createElement("button");
          noteButton.className = "noteButton";
          noteButton.type = "button";
          noteButton.setAttribute("aria-expanded", "false");
          updateNoteButtonState(noteButton, offer, dimension);
          noteButton.addEventListener("click", () => openNoteEditor(offer.id, dimension.id));

          const scoreWarning = document.createElement("span");
          scoreWarning.className = "scoreWarning";
          scoreWarning.textContent = "请输入 0-10 的整数";

          input.addEventListener("beforeinput", (event) => {
            if (event.inputType.startsWith("delete") || event.inputType === "insertFromPaste") {
              return;
            }
            if (!/^\d*$/.test(event.data || "")) {
              event.preventDefault();
            }
          });
          input.addEventListener("input", (event) => {
            const sanitized = sanitizeScoreInput(event.target.value);
            if (event.target.value !== sanitized) {
              event.target.value = sanitized;
            }
            const message = getScoreValidationMessage(sanitized);
            cell.classList.toggle("hasError", Boolean(message));
            if (message) {
              scoreWarning.textContent = message;
              return;
            }

            offer.scores[dimension.id] = sanitized === "" ? "" : Number(sanitized);
            updateScoreProgress(activeArchive);
            renderRanking();
            drawRadar();
            saveState();
          });
          input.addEventListener("keydown", (event) => {
            if (event.key !== "Enter") {
              return;
            }
            event.preventDefault();
            const dimensionIndex = dimensions.findIndex((item) => item.id === dimension.id);
            const nextDimension = dimensions[dimensionIndex + 1];
            scoreBody.querySelector(
              `.scoreCell[data-offer-id="${offer.id}"][data-dimension-id="${nextDimension?.id}"] .scoreInput`
            )?.focus();
          });

          cell.append(input, noteButton, scoreWarning);
          row.appendChild(cell);
        });

    function getTotalWeight(activeArchive = getActiveArchive()) {
      return dimensions.reduce((sum, dimension) => sum + activeArchive.weights[dimension.id], 0);
    }

    function getWeightedSum(offer, activeArchive = getActiveArchive()) {
      return dimensions.reduce((sum, dimension) => {
        return sum + getScoreNumber(offer.scores[dimension.id]) * activeArchive.weights[dimension.id];
      }, 0);
    }

    function getWeightedScore(offer) {
      const activeArchive = getActiveArchive();
      const totalWeight = getTotalWeight(activeArchive);
      if (totalWeight === 0) {
        return 0;
      }

      return getWeightedSum(offer, activeArchive) / totalWeight;
    }

    function getRanking() {
      const activeArchive = getActiveArchive();
      const { eligibleOfferIds } = getHardConstraintStatus(dimensions, activeArchive);
      const eligibleIds = new Set(eligibleOfferIds);
      return activeArchive.offers
        .filter((offer) => eligibleIds.has(offer.id))
        .map((offer) => ({
          ...offer,
          weightedScore: getWeightedScore(offer)
        }))
        .sort((a, b) => b.weightedScore - a.weightedScore);
    }
